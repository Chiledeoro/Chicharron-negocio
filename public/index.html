      });
    });

    bodyEl.querySelectorAll('[data-cancelar-edit-gasto]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        editandoGasto = null;
        render();
      });
    });

    bodyEl.querySelectorAll('[data-guardar-gasto]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.guardarGasto;
        const gasto = state.gastos.find(g=>g.id===id);
        if(!gasto) return;
        const fecha = document.getElementById(`editGastoFecha_${id}`).value;
        const monto = Number(document.getElementById(`editGastoMonto_${id}`).value);
        const concepto = document.getElementById(`editGastoConcepto_${id}`).value;
        const destino = document.getElementById(`editGastoDestino_${id}`).value;
        if(!fecha || !monto || !concepto){
          alert('Llena fecha, monto y en qué se gastó.');
          return;
        }
        gasto.fecha = fecha;
        gasto.monto = monto;
        gasto.concepto = concepto;
        gasto.destino = destino;
        editandoGasto = null;
        render();
        saveData();
      });
    });
  }

  // ---------- USUARIOS ----------
  let listaUsuarios = [];
  let errorUsuario = '';
  let editandoUsuario = null;

  async function cargarUsuarios(){
    try{
      const res = await apiFetch('/api/usuarios');
      if(res.ok){
        listaUsuarios = await res.json();
      }
    }catch(e){
      console.error('Error cargando usuarios', e);
    }
    render();
  }

  function renderUsuarios(){
    const rolClase = (r)=> r==='admin' ? 'cc-rol-admin' : r==='vista' ? 'cc-rol-vista' : 'cc-rol-usuario';
    bodyEl.innerHTML = `
      <div class="cc-pagehead">
        <div>
          <h2 class="cc-title">Usuarios</h2>
          <div class="cc-sub">${listaUsuarios.length} ${listaUsuarios.length===1?'usuario':'usuarios'} con acceso a la app</div>
        </div>
      </div>
      <div class="cc-twocol">
        <div class="cc-listcard" id="usuariosList">
          ${listaUsuarios.length===0 ? '<div class="cc-empty">Cargando usuarios...</div>' :
            listaUsuarios.map(u=>{
              if(editandoUsuario === u.id){
                return `
                  <div class="cc-editbox">
                    <div class="cc-form-row">
                      <div class="cc-field">
                        <label>Nombre</label>
                        <input type="text" id="editUsuarioNombre_${u.id}" value="${u.nombre}" />
                      </div>
                      <div class="cc-field">
                        <label>Usuario (para entrar)</label>
                        <input type="text" id="editUsuarioLogin_${u.id}" value="${u.usuario}" />
                      </div>
                    </div>
                    <div class="cc-form-row">
                      <div class="cc-field">
                        <label>Nueva contraseña</label>
                        <input type="text" id="editUsuarioPassword_${u.id}" placeholder="Dejar en blanco para no cambiarla" />
                      </div>
                      <div class="cc-field">
                        <label>Rol</label>
                        <select id="editUsuarioRol_${u.id}">
                          <option value="usuario" ${u.rol==='usuario'?'selected':''}>Usuario (captura, no edita ni elimina)</option>
                          <option value="vista" ${u.rol==='vista'?'selected':''}>Solo Vista (no captura, no edita, no elimina)</option>
                          <option value="admin" ${u.rol==='admin'?'selected':''}>Administrador (todo)</option>
                        </select>
                      </div>
                    </div>
                    <div style="display:flex; gap:8px;">
                      <button class="cc-btn small" data-guardar-usuario="${u.id}">Guardar</button>
                      <button class="cc-btn small ghost" data-cancelar-edit-usuario="${u.id}">Cancelar</button>
                    </div>
                  </div>
                `;
              }
              return `
              <div class="cc-rowi">
                <div class="cc-av">${iniciales(u.nombre)}</div>
                <div class="grow">
                  <div class="nm">${u.nombre}</div>
                  <div class="sb"><span>@${u.usuario}</span>
                    <span class="cc-links">
                      <button class="cc-linkbtn" data-editar-usuario="${u.id}">Editar</button>
                      ${String(u.id) !== String(sesion.id) ? `<button class="cc-linkbtn danger" data-del-usuario="${u.id}">Eliminar</button>` : ''}
                    </span>
                  </div>
                </div>
                <span class="cc-rolpill ${rolClase(u.rol)}">${etiquetaRol(u.rol)}</span>
              </div>
            `;}).join('')
          }
        </div>
        <div class="cc-formcard">
          <h3>Nuevo usuario</h3>
          <div class="cc-field" style="margin-bottom:10px;">
            <label>Nombre</label>
            <input type="text" id="nuevoUsuarioNombre" placeholder="Ej. Esposa de Aldo" />
          </div>
          <div class="cc-field" style="margin-bottom:10px;">
            <label>Usuario para entrar</label>
            <input type="text" id="nuevoUsuarioLogin" placeholder="Ej. esposa" />
          </div>
          <div class="cc-field" style="margin-bottom:10px;">
            <label>Contraseña</label>
            <input type="text" id="nuevoUsuarioPassword" placeholder="Contraseña" />
          </div>
          <div class="cc-field" style="margin-bottom:12px;">
            <label>Rol</label>
            <select id="nuevoUsuarioRol">
              <option value="usuario">Usuario — captura, no edita ni elimina</option>
              <option value="vista">Solo Vista — no captura, no edita, no elimina</option>
              <option value="admin">Administrador — acceso total</option>
            </select>
          </div>
          ${errorUsuario ? `<p style="color:#a8291f; font-size:13px; margin:0 0 10px;">${errorUsuario}</p>` : ''}
          <button class="cc-btn" type="button" id="crearUsuarioBtn">Crear usuario</button>
        </div>
      </div>
    `;

    document.getElementById('crearUsuarioBtn').addEventListener('click', async ()=>{
      const nombre = document.getElementById('nuevoUsuarioNombre').value.trim();
      const usuario = document.getElementById('nuevoUsuarioLogin').value.trim();
      const password = document.getElementById('nuevoUsuarioPassword').value;
      const rol = document.getElementById('nuevoUsuarioRol').value;
      if(!nombre || !usuario || !password){
        errorUsuario = 'Llena nombre, usuario y contraseña.';
        render();
        return;
      }
      try{
        const res = await apiFetch('/api/usuarios', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, usuario, password, rol })
        });
        const datos = await res.json();
        if(!res.ok){
          errorUsuario = datos.error || 'No se pudo crear el usuario.';
          render();
          return;
        }
        errorUsuario = '';
        await cargarUsuarios();
      }catch(e){
        errorUsuario = 'No se pudo conectar con el servidor.';
        render();
      }
    });

    bodyEl.querySelectorAll('[data-del-usuario]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        armarConfirmacion(btn, '¿Seguro? Clic de nuevo', async ()=>{
          const id = btn.dataset.delUsuario;
          await apiFetch(`/api/usuarios/${id}`, { method: 'DELETE' });
          await cargarUsuarios();
        });
      });
    });

    bodyEl.querySelectorAll('[data-editar-usuario]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        editandoUsuario = Number(btn.dataset.editarUsuario);
        render();
      });
    });

    bodyEl.querySelectorAll('[data-cancelar-edit-usuario]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        editandoUsuario = null;
        render();
      });
    });

    bodyEl.querySelectorAll('[data-guardar-usuario]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.guardarUsuario;
        const nombre = document.getElementById(`editUsuarioNombre_${id}`).value.trim();
        const usuario = document.getElementById(`editUsuarioLogin_${id}`).value.trim();
        const password = document.getElementById(`editUsuarioPassword_${id}`).value;
        const rol = document.getElementById(`editUsuarioRol_${id}`).value;
        if(!nombre || !usuario){
          alert('Llena nombre y usuario.');
          return;
        }
        try{
          const res = await apiFetch(`/api/usuarios/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, usuario, password: password || undefined, rol })
          });
          const datos = await res.json();
          if(!res.ok){
            alert(datos.error || 'No se pudo editar el usuario.');
            return;
          }
          // si el admin se edita a si mismo, actualiza tambien el nombre mostrado en el encabezado
          if(String(id) === String(sesion.id)){
            guardarSesion({ ...sesion, nombre, usuario, rol });
          }
          editandoUsuario = null;
          await cargarUsuarios();
        }catch(e){
          alert('No se pudo conectar con el servidor.');
        }
      });
    });
  }

  // ---------- CAJA ----------
  let editandoSaldoInicial = false;

  let utilidadFilter = 'todos';

  function renderUtilidades(){
    const totalVendido = state.ventas.reduce((s,v)=>s+Number(v.precioTotal),0);
    const totalGastos = state.gastos.reduce((s,g)=>s+Number(g.monto),0);
    const utilidadTotal = Math.round((totalVendido - totalGastos) * 100) / 100;

    let listaGrupos = agruparLotes().map(g=>{
      const vendido = vendidoDelGrupoLote(g);
      const gastos = gastosDelGrupoLote(g.key);
      const utilidad = Math.round((vendido - gastos) * 100) / 100;
      const cerrado = state.lotesCerrados.includes(g.key);
      return { ...g, vendido, gastos, utilidad, cerrado };
    });

    if(utilidadFilter === 'cerrados'){
      listaGrupos = listaGrupos.filter(g=>g.cerrado);
    }
    listaGrupos.sort((a,b)=> b.utilidad - a.utilidad);

    const margen = totalVendido > 0 ? Math.round(utilidadTotal / totalVendido * 100) : 0;
    bodyEl.innerHTML = `
      <div class="cc-pagehead">
        <div>
          <h2 class="cc-title">Utilidades</h2>
          <div class="cc-sub">Ganancia por lote, de mayor a menor</div>
        </div>
      </div>
      <div class="cc-hero ${utilidadTotal>=0?'green':''}" style="margin-bottom:14px;">
        <div class="label">Utilidad total · margen ${margen}%</div>
        <div class="big">${money(utilidadTotal)}</div>
        <div class="small">Vendido ${money(totalVendido)} − gastos ${money(totalGastos)}</div>
      </div>
      <div class="cc-filterbar">
        <div class="cc-filter-btn ${utilidadFilter==='todos'?'active':''}" data-utilidad-filter="todos">Todos los lotes</div>
        <div class="cc-filter-btn ${utilidadFilter==='cerrados'?'active':''}" data-utilidad-filter="cerrados">Solo cerrados</div>
      </div>
      <div class="cc-listcard">
        ${listaGrupos.length===0 ? '<div class="cc-empty">No hay lotes en esta categoría.</div>' :
          listaGrupos.map(g=>{
            const tot = Math.max(g.vendido, g.gastos, 0.01);
            const pu = Math.max(0, g.utilidad) / tot * 100;
            const pg = Math.min(g.gastos, tot) / tot * 100;
            return `
            <div class="cc-urow">
              <div class="l1">
                <div class="t">L${g.folio} · ${fechaBonita(g.items[0].fecha)}
                  <span class="cc-pill ${g.cerrado?'neutral':'pagado'}">${g.cerrado?'Cerrado':'Abierto'}</span>
                </div>
                <div style="font-size:16px; font-weight:700; color:${g.utilidad>=0?'#3f6b3a':'#a8291f'}">${money(g.utilidad)}</div>
              </div>
              <div class="cc-ubar"><i style="width:${pu}%; background:#3f6b3a"></i><i style="width:${pg}%; background:#e3a597"></i></div>
              <div class="cc-meta">Vendido ${money(g.vendido)} · gastos ${money(g.gastos)}</div>
            </div>`;
          }).join('')
        }
      </div>
    `;

    bodyEl.querySelectorAll('[data-utilidad-filter]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ utilidadFilter = btn.dataset.utilidadFilter; render(); });
    });
  }

  function renderCaja(){
    const entradas = entradasDeCaja().map(e=>({...e, tipo:'entrada'}));
    const salidas = state.gastos.map(g=>({
      fecha: g.fecha,
      tipo: 'salida',
      concepto: `G${folioDeGasto(g.id)} - ${g.concepto}`,
      monto: Number(g.monto)
    }));

    const movimientos = [...entradas, ...salidas].sort((a,b)=> a.fecha.localeCompare(b.fecha) || 0);
    let running = state.saldoInicial || 0;
    const conBalance = movimientos.map(m=>{
      running += (m.tipo==='entrada' ? m.monto : -m.monto);
      return {...m, balance: running};
    });
    const saldoActual = running;
    const totalEntradas = entradas.reduce((s,m)=>s+m.monto,0);
    const totalSalidas = salidas.reduce((s,m)=>s+m.monto,0);

    const paraMostrar = [...conBalance].reverse();

    bodyEl.innerHTML = `
      <div class="cc-pagehead">
        <div>
          <h2 class="cc-title">Caja</h2>
          <div class="cc-sub">Entradas, salidas y saldo después de cada movimiento</div>
        </div>
      </div>
      <div class="cc-bigcard">
        <div class="top">
          <div class="lbl">Saldo en caja</div>
          <div class="num" style="color:${saldoActual>=0?'var(--char)':'#a8291f'}">${money(saldoActual)}</div>
        </div>
        <div class="cc-stripe3">
          <div>
            <span>Saldo inicial</span>
            <b>${money(state.saldoInicial || 0)}</b>
            ${esAdmin() && !editandoSaldoInicial ? `<button class="cc-linkbtn" type="button" id="editarSaldoInicialBtn" style="padding:0; min-height:0; text-align:left;">Editar</button>` : ''}
          </div>
          <div><span>+ Entradas</span><b style="color:var(--money)">${money(totalEntradas)}</b></div>
          <div><span>− Salidas</span><b style="color:#a8291f">${money(totalSalidas)}</b></div>
        </div>
      </div>
      ${esAdmin() && editandoSaldoInicial ? `
      <div class="cc-formcard">
        <h3>Saldo inicial</h3>
        <p class="cc-meta" style="margin:-6px 0 12px;">El dinero que ya tenías en la mano antes de empezar a usar la app. Se suma una sola vez al total de caja.</p>
        <div class="cc-addrow">
          <input type="number" id="saldoInicialInput" min="0" step="0.01" inputmode="decimal" value="${state.saldoInicial || 0}" />
          <button class="cc-btn small" type="button" id="guardarSaldoInicialBtn">Guardar</button>
          <button class="cc-btn small ghost" type="button" id="cancelarSaldoInicialBtn">Cancelar</button>
        </div>
      </div>
      ` : ''}
      <div class="cc-sect">Movimientos</div>
      <div class="cc-listcard">
        ${paraMostrar.length===0 ? '<div class="cc-empty">Aún no hay movimientos. Registra pagos de ventas o gastos.</div>' :
          paraMostrar.map(m=>{
            const col = m.tipo==='entrada' ? '#3f6b3a' : '#a8291f';
            return `
            <div class="cc-rowi">
              <span class="cc-dotm" style="background:${col}"></span>
              <div class="grow">
                <div class="nm">${m.concepto}</div>
                <div class="sb">${m.fecha} · ${m.tipo==='entrada'?'Entrada':'Salida'}</div>
              </div>
              <div class="rt">
                <div class="amt" style="color:${col}">${m.tipo==='entrada'?'+':'−'}${money(m.monto)}</div>
                <div class="sm">saldo ${money(m.balance)}</div>
              </div>
            </div>`;
          }).join('')
        }
      </div>
    `;

    const editarBtn = document.getElementById('editarSaldoInicialBtn');
    if(editarBtn) editarBtn.addEventListener('click', ()=>{
      editandoSaldoInicial = true;
      render();
    });

    const cancelarBtn = document.getElementById('cancelarSaldoInicialBtn');
    if(cancelarBtn) cancelarBtn.addEventListener('click', ()=>{
      editandoSaldoInicial = false;
      render();
    });

    const guardarBtn = document.getElementById('guardarSaldoInicialBtn');
    if(guardarBtn) guardarBtn.addEventListener('click', ()=>{
      const valor = Number(document.getElementById('saldoInicialInput').value) || 0;
      state.saldoInicial = valor;
      editandoSaldoInicial = false;
      render();
      saveData();
    });
  }

  function aplicarTema(){
    app.classList.toggle('dark', !!state.temaOscuro);
    const btn = document.getElementById('temaToggleBtn');
    if(btn) btn.textContent = state.temaOscuro ? '☀️ Modo claro' : '🌙 Modo oscuro';
  }

  document.getElementById('temaToggleBtn').addEventListener('click', ()=>{
    state.temaOscuro = !state.temaOscuro;
    aplicarTema();
    saveData();
  });

  function iniciar(){
    const guardada = localStorage.getItem('cc_sesion');
    if(guardada){
      try{
        sesion = JSON.parse(guardada);
      }catch(e){
        sesion = null;
      }
    }
    if(sesion){
      loadData();
    } else {
      render();
    }
  }

  iniciar();
})();
</script>
</body>
</html>
